<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        thead {
            background-color: gray;
        }
        
        th, td {
            border: 1px solid gray;
            padding: 10px;

        }
        th,#Media {
          background-color: gray;
          color: white;
        }
        .Human {
            background-color: white;
            color: black ;
        }
        .Exatas {
            background-color: white;
            color: black;
        }
        .Numeros {
            background-color: gray;
            color: white;
        }
       
        
    </style>
</head>
<body>
    <table>
        <thead>
            <tfoot>
                <tr>
                    <th colspan="3" id="Media"> Média de Humanas</th>
                    <td class="Numeros">6</td>
                </tr>
                <tr>
                  
                   
                 
            </tfoot>
           
            <Th>Àrea</Th>
            <Th colspan="1">Disciplinas</Th>
            <th>Notas</th>
            <th>Média</th>
        </thead>
        <tbody>
            <tr>
              <th rowspan="4" class="Exatas">Exatas</th>
              <td>Matematica</td>
              <td>10</td>
              <td>6</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>8</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>9</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>10</td>
                <td>6</td>
            </tr>
            <tr>
                <th colspan="3">Media de Exatas</th>
                 <td class="Numeros">6</td>
                </tr>
                <tr>
                <th rowspan="2" class="Human">Humanas</th>
                    <td>Historia</td>
                    <td>8</td>
                    <td>6</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>9</td>
                    <td>6</td>
                </tr>
            </tr>
          
        </tbody>
        
    </table>
</body>
</html>
